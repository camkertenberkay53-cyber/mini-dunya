    kaynak: polyhaven/wooden_crate_01
    rol: ayrinti
    donem: [bizans-15yy, osmanli-15yy, akkoyunlu-15yy]
    tarih: {guven: makul, not: "Ahşap sandık; genel."}

  # --- Ağaçlar: kendi prosedürel üretecimiz (gövde/dal geometrisi) + CC0 fotoğraf dokuları (kabuk, yaprak, iğne) ---
