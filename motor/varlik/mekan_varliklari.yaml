# Gerçekçi mekân varlıkları (mekân kalite paketi). Kaynak: motor/varlik/cc0 (lisansı kaynağın API'sinden doğrulanmış
# CC0 indirmeler, cc0/lisans.json). Üretim: python3 -m motor.varlik.mekan_varlik → ONBELLEK/mekan/<id>.glb
# Kayıt: mekan_varlik_kaydi.json (ölçüm, sha256, lisans, kaynak). Kalite: mekan_varlik.kalite_sinifi (çevre ölçeğine göre).
#
# yerine: bu varlık hangi stilize katalog parçasının YERİNE kullanılır (gorsel.yaml mekan_kalite.acik iken).
#   Varlık üretilmemişse ya da RED ise eski parça kullanılmaya devam eder (geri alınabilir, kırılmaz).
# nesneler: modüler setten yalnız bu nesneler alınır (bir set birden çok varlığa bölünür).
# yon_derece: uzun eksen +X olacak şekilde döndürme (yerleşim kodu +X'i duvar/sokak boyunca hizalar).
varliklar:
  # --- Kale: Poly Haven "Modular Fort 01" (gerçek taş/sıva PBR, 22 modül) ---
  sur_kalin_hd:
    kaynak: polyhaven/modular_fort_01
    nesneler: [modular_fort_01_wall_thick_straight_02]
    yon_derece: 90
    ucgen_hedef: 6000
    yerine: [sur_burclu]
    rol: sur_modul
    donem: [bizans-15yy, osmanli-15yy, akkoyunlu-15yy]
    tarih: {guven: makul, not: "Sıvalı moloz taş sur, yürüme yolu; kolonyal tahkimat modülü, genel kale duvarı olarak temsilî."}
  sur_kapi_hd:
    kaynak: polyhaven/modular_fort_01
    nesneler: [modular_fort_01_wall_thin_gate_01]
    yon_derece: 90
    yerine: [kale_kapisi]
    donem: [bizans-15yy, osmanli-15yy, akkoyunlu-15yy]
    tarih: {guven: makul, not: "Kemerli sur kapısı; temsilî."}
  kule_yuvarlak_hd:
    kaynak: polyhaven/modular_fort_01
    nesneler: [modular_fort_01_tower_round]
    yerine: [gozetleme_kulesi]
    donem: [bizans-15yy, osmanli-15yy, akkoyunlu-15yy]
    tarih: {guven: makul, not: "Yuvarlak taş tabya/kule; 15. yy topçu çağı tahkimatına uygun biçim, temsilî."}
  # --- Liman: Poly Haven tarihî yelkenliler ve iskele ---
  yelkenli_orta_hd:
    kaynak: polyhaven/dutch_ship_medium
    ucgen_hedef: 28000
    yerine: [yelkenli_gemi]
    donem: [bizans-15yy, osmanli-15yy]
    tarih: {guven: zayif, not: "17. yy Hollanda tipi tüccar yelkenlisi; 15. yy karrak/kalyon soyuna yakın, temsilî."}
  yelkenli_buyuk_hd:
    kaynak: polyhaven/dutch_ship_large_02
    yon_derece: 90
    ucgen_hedef: 32000
    yerine: [yelkenli_gemi]
    donem: [bizans-15yy, osmanli-15yy]
    tarih: {guven: zayif, not: "17. yy büyük yelkenli; 15-16. yy kalyon/karrak yerine temsilî."}
  iskele_hd:
    kaynak: polyhaven/modular_wooden_pier
    yon_derece: 90
    ucgen_hedef: 14000
    rol: iskele
    donem: [bizans-15yy, osmanli-15yy, akkoyunlu-15yy, roma-cumhuriyet]
    tarih: {guven: makul, not: "Ahşap kazıklı iskele; her dönem için genel."}
  # --- Dağ/kaya: fotogrametrik (taranmış) gerçek kayalar ---
  yamac_kaya_hd:
    kaynak: polyhaven/mountainside
    ucgen_hedef: 14000
    yerine: [ucurum_1]
    donem: [bizans-15yy, osmanli-15yy, akkoyunlu-15yy, roma-cumhuriyet]
    tarih: {guven: kesin, not: "Doğal kaya (taranmış)."}
  ucurum_kaya_hd:
    kaynak: polyhaven/namaqualand_cliff_01
    ucgen_hedef: 12000
    yerine: [ucurum_1]
    donem: [bizans-15yy, osmanli-15yy, akkoyunlu-15yy, roma-cumhuriyet]
    tarih: {guven: kesin, not: "Doğal kaya (taranmış)."}
  kaya_yuzu_hd:
    kaynak: polyhaven/rock_face_01
    ucgen_hedef: 10000
    yerine: [ucurum_1]
    donem: [bizans-15yy, osmanli-15yy, akkoyunlu-15yy, roma-cumhuriyet]
    tarih: {guven: kesin, not: "Doğal kaya yüzü (taranmış, tek yüzlü: ön yüzü sahneye döndürülür)."}
  kaya_iri_hd:
    kaynak: polyhaven/boulder_01
    ucgen_hedef: 6000
    yerine: [kaya_1, kaya_2]
    donem: [bizans-15yy, osmanli-15yy, akkoyunlu-15yy, roma-cumhuriyet]
    tarih: {guven: kesin, not: "Doğal iri kaya (taranmış, her yönden kapalı)."}
  # --- Kasaba/liman ayrıntısı ---
  fici_grubu_hd:
    kaynak: polyhaven/wooden_barrels_01
    ucgen_hedef: 8000
    rol: ayrinti
    donem: [bizans-15yy, osmanli-15yy, akkoyunlu-15yy, roma-cumhuriyet]
    tarih: {guven: makul, not: "Ahşap fıçılar; genel."}
