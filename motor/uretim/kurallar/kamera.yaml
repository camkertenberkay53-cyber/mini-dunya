# Çekim kataloğu (konudan bağımsız). Planlayıcı her çekim için buradan, çeşitlilik kurallarına uyan bir tür seçer.
# aci_derece: kameranın, odak karakterin baktığı yöne göre konumu (0 = tam karşıdan, 90 = sağ yandan, 180 = arkadan)
# yukseklik_m: kamera yüksekliği; hedef_y_m: bakılan noktanın yüksekliği (odak karakterin ayağına göre)
# oran: hedeflenen ekran oranı (karakter boyu / görünen yükseklik); mesafe.yaml sınırlarının içinde kalmalı
# gerekli: takip türleri hareket eden odak ister
hedef_oran: {orta: 0.55, uzak: 0.17}
fov: 38
cekimler:
  alcak_yaklasma:   {aciklama: Alçak açıdan yavaş yaklaşma (güç, kahramanlık), aci_derece: 15, yukseklik_m: 0.6, hedef_y_m: 1.6, hareket: yaklasma, mesafeler: [orta]}
  alcak_geri_takip: {aciklama: Gelen kolun önünde, alçak açıyla geri çekilerek takip, aci_derece: 20, yukseklik_m: 0.9, hedef_y_m: 1.5, hareket: geri_takip, mesafeler: [orta], gerekli: hareketli}
  yan_takip:        {aciklama: Göz hizasında yandan paralel takip, aci_derece: 80, yukseklik_m: 1.6, hedef_y_m: 1.3, hareket: takip, mesafeler: [orta, uzak], gerekli: hareketli}
  yuksek_genis:     {aciklama: Yüksekten genel görünüm (kuş bakışına yakın), aci_derece: 140, yukseklik_m: 9.0, hedef_y_m: 0.5, hareket: sabit_suzulme, mesafeler: [uzak]}
  yukselme:         {aciklama: Yerden yükselen vinç hareketi (kapanış, büyüklük), aci_derece: 25, yukseklik_m: 1.0, hedef_y_m: 1.4, hareket: yukselme, mesafeler: [uzak]}
  arkadan_uzak:     {aciklama: Uzaklaşan kolu arkadan izleme (yolculuk, gidiş), aci_derece: 170, yukseklik_m: 2.4, hedef_y_m: 1.0, hareket: sabit, mesafeler: [uzak], gerekli: hareketli}
  capraz_yorunge:   {aciklama: Çapraz açıdan yarım yörünge (gerilim), aci_derece: 45, yukseklik_m: 1.4, hedef_y_m: 1.3, hareket: yorunge, mesafeler: [orta, uzak]}
  goz_pan:          {aciklama: Göz hizasında hattı tarayan yatay kaydırma, aci_derece: 0, yukseklik_m: 1.55, hedef_y_m: 1.3, hareket: yanal_kayma, mesafeler: [orta, uzak]}
  sabit_uzak:       {aciklama: Sabit uzak kadraj (sonuç, kayıp), aci_derece: 60, yukseklik_m: 1.3, hedef_y_m: 0.6, hareket: sabit, mesafeler: [uzak]}
yukseklik_siniflari: {alcak: 1.0, yuksek: 2.2}   # < alcak: alçak açı; > yuksek: yüksek açı; arası göz hizası
aci_kovalari: {onden: 35, capraz: 70, yan: 115, capraz_arka: 150}   # |açı| bu sınırların altında: o kova; üstü: arka
# Kalabalık çekimde karakterlerin en az bu oranı kadrajda görünmeli (görünmeyen karakter render maliyetidir, anlatıya
# katkısı yoktur). Planlayıcı uygun türler arasında bu oranı sağlayanı seçer; hiçbiri sağlamazsa en iyisini seçer ve
# denetim uyarısı kalır.
en_az_gorunur_oran: 0.6
