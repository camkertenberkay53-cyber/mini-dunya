# Sinematik paket 2: prosedürel yerleşimler (godot/sahneler/yerlesim.gd). Senaryo niyetinde ortam.yerlesim ile istenir.
# Parçalar dönem kataloğundan seçilir (dönemde kayıtlı olmayan çadır kullanılmaz; uydurulmaz).
yerlesimler:
  ordugah:
    aciklama: Ordugâh — dönemin çadırları sıra sıra, aralarda yük arabaları ve kamp ateşleri.
    cadir_adaylari: [osmanli_cadiri, topak_ev, roma_cadiri]   # dönemine uyan(lar) kullanılır
    ek_adaylari: [yuk_arabasi]
    adet: 16
    mesafe_m: [16.0, 62.0]
    yan_oran: 0.55
    aralik_m: 9.0
    oyuncu_payi_m: 10.0
    gorus_payi_m: 4.0
    araba_her: 5
    ates_her: 3
    isik_guc: 1.6
    isik_menzil_m: 7.0
    alev_doku: varlik/kenney_parcacik/flame_02.png
    duman_doku: varlik/kenney_parcacik/smoke_04.png
  # --- Mekân paketi (godot/sahneler/yerlesim.gd 'dizi'): rol → aday parçalar; dönemde kayıtlı olmayan aday kullanılmaz.
  kale:
    aciklama: Kamera karşısında sur hattı (ortada kapı, iki yanda burçlu sur), arkada iç kale, uçlarda gözetleme kuleleri.
    roller: {sur: [sur_burclu], kapi: [kale_kapisi], ic_kale: [burc_ev], kule: [gozetleme_kulesi]}
    mesafe_m: 34.0
    hd:   # gerçekçi modüler sur: kapının iki yanına sur modülleri uç uca dizilir, uçlarda yuvarlak kule
      dose: true
      sur_yari_m: 34.0
      bindirme_m: 0.4
  kasaba:
    aciklama: Sahneden ileri uzanan sokak; iki yanda evler, pazar tezgâhları, sokağın sonunda burçlu yapı.
    roller: {ev: [ev_kerpic_ahsap, ev_tas], tezgah: [pazar_tezgahi, yuk_arabasi], son: [burc_ev]}
    hd:
      roller: {ev: [ev_kerpic_ahsap, ev_tas], tezgah: [pazar_tezgahi, yuk_arabasi], son: [burc_ev], ayrinti: [fici_grubu_hd, sandik_hd]}
    sokak_yari_m: 7.5
    bas_m: 12.0
    son_m: 70.0
    aralik_m: [9.0, 12.0]
  liman:
    aciklama: Kumsal açığında sandallar; açıkta demirli yelkenliler (dalgayla salınır).
    roller: {gemi: [yelkenli_gemi], sandal: [sandal]}
    gemi_adet: 4
    gemi_mesafe_m: [14.0, 70.0]
    salinim_derece: 2.5
    hd:   # gerçek ölçekli (24-34 m) yelkenliler daha açıkta ve daha seyrek; kıyıdan suya uzanan ahşap iskele + fıçı/sandık
      roller: {gemi: [yelkenli_gemi], sandal: [sandal], iskele: [iskele_hd], ayrinti: [fici_grubu_hd, sandik_hd]}
      gemi_adet: 3
      gemi_mesafe_m: [30.0, 90.0]
      iskele_yon: ileri
      salinim_derece: 1.2
  nehir_iskelesi:
    aciklama: Nehirde kayıklar.
    roller: {sandal: [sandal]}
    sandal_adet: 4
    salinim_derece: 1.2
