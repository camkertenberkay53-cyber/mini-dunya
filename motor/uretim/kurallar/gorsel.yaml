# Görsel profil (konudan bağımsız) — Faz 5.2 iyileştirmeleri. render.is_hazirla aktif profili her işe ekler:
# isik → is.json isik.gorsel, arazi → is.json arazi.gorsel (sahneler/ortam.gd okur).
# faz52: yönetimin kabul ettiği D1–D5, D9–D15b, D16s, D17 zinciri (deney profili D17, Faz 5.2 raporu); V2 renk
#        profili dahil. Ölçüm ve karşılaştırmalar: deneyler/faz51/gorsel/sonuc52.
# faz54: faz52 + prosedürel bulutlu gök (varlık yok; güneş yönü sahne ışığından) + Poly Haven CC0 zemin ayrıntı
#        dokusu (yalnız parlaklık ayrıntısı + normal; renk arazi hazır ayarından). Dosya yolları motor/ köküne göredir.
#        arazi_ozel: arazi hazır ayarına göre ek/farklı anahtarlar (konudan bağımsız, coğrafyaya bağlı).
# yok:   geri dönüş — Faz 5.2 öncesi üretim görüntüsü (piksel eşitliği test edilir).
aktif: faz54
profiller:
  faz52:
    isik:
      tonemap: filmic
      pozlama: 1.24
      kontrast: 1.15
      doygunluk: 1.0
      glow: 0.12
      gok_tepe: [0.16, 0.34, 0.62]
      gok_ufuk: [0.86, 0.74, 0.6]
      gok_egri: 0.25
      sis_carpan: 0.6
      sis_gok: 0.25
      yer_sisi_carpan: 0.4
      gunes_carpan: 1.2
      golge_yumusaklik: 1.6
      ortam_isik: 0.42
      sis_renk_carpan: 0.67
    arazi: {ot_alt_parlaklik: 0.75, ot_genislik_carpan: 5.0, ot_boy_carpan: 0.85, ot_sayi_carpan: 1.2, ot_normal: yukari, ot_bicim: tutam, ot_dagilim: kume,
      kume_yaricap: 0.45, dag_bicim: arazi, dag_yukseklik: 70.0, ot_ust_carpan: 0.7, dag_bas: 110.0, dag_tam: 330.0, dag_ton: 0.65, dag_pus_yogunluk: 0.0025,
      dag_pus_max: 0.35, dag_gecis: true, gecis_bas: 200.0, dag_pus: dinamik, dag_pus_katsayi: 0.68, zemin_iz: tekerlek, teker_derinlik: 0.15,
      teker_genislik: 0.3, ot_parca: 4.0, dag_golge_al: yok, dag_golge: yok, ot_cesit: true}
  yok:
    isik: {}
    arazi: {}
  faz54:
    taban: faz52
    isik: {gok_bulut: true, bulut_miktar: 0.42, bulut_olcek: 1.4, bulut_yogunluk: 0.85}
    arazi: {zemin_alb: varlik/polyhaven/rocks_ground_02/diff.jpg, zemin_nor: varlik/polyhaven/rocks_ground_02/nor_gl.jpg,
      doku_olcek: 0.35, doku_karisim: 0.8, doku_renk: 0.0, doku_normal: 0.8}
    arazi_ozel:
      kuru_bozkir: {zemin_alb: varlik/polyhaven/mud_cracked_dry_03/diff.jpg, zemin_nor: varlik/polyhaven/mud_cracked_dry_03/nor_gl.jpg}
# Faz 5.6 (paket): kişi başına tohumlu görünüm çeşitliliği — klon görünümünü azaltır. acik: false → eski davranış (geri alma).
karakter_cesit:
  acik: true
  kumas_ton: 0.22          # beyaz→rastgele renk tonu karışımı (0 = yok)
  kumas_deger: [0.70, 1.15]
  deri_deger: [0.85, 1.10]
  metal_deger: [0.93, 1.05]
  ten: [0.62, 1.05]
  ten_sicak: 0.35
  sac: [0.12, 1.0]
  genislik: [0.95, 1.07]
# Sinematik paket: parçacık efektleri (CPU, belirlenimci). acik: false → efekt yok (geri alma).
# Doku: Kenney Particle Pack (CC0; varlik/kenney_parcacik/LICENSE.txt). renk_arazi: tozun rengi araziye göre.
vfx:
  acik: true
  toz:
    esik_hiz: 2.5              # m/sn; bundan hızlı ilerleyen (dörtnala at, koşan asker) toz kaldırır
    adet: 30
    omur: 2.2
    boyut: [2.6, 5.0]
    opaklik: 0.6
    geri_m: -0.4
    geri_binek_m: -1.3
    doku: varlik/kenney_parcacik/smoke_04.png
    renk: [0.80, 0.72, 0.60]
    renk_arazi: {kuru_bozkir: [0.84, 0.76, 0.62], ova_cimen: [0.66, 0.60, 0.50]}
  duman:                       # çarpışma (kılıç/ölüm animasyonu olan) çekimlerde arka plan savaş dumanı
    obek: 3
    adet: 7
    omur: 7.0
    boyut: [10.0, 17.0]
    opaklik: 0.55
    yaricap_m: 5.0
    yan_oran: 0.3
    mesafe_m: [14.0, 30.0]
    doku: varlik/kenney_parcacik/smoke_07.png
    renk: [0.44, 0.42, 0.40]
  savas_animasyonlari: [Sword_Attack, Sword_Idle, Death01, Hit_Chest, ual2/Sword_Regular_Combo, ual2/Sword_Block, ual2/Hit_Knockback, ual2/Shield_OneShot]
# Sinematik paket: son işlem katmanı (godot/sahneler/sinema.gd; kendi yazımımız). acik: false → katman yok (geri alma).
sinema:
  acik: true
  vinyet: 0.42
  vinyet_yumusak: 0.55
  golge_ton: [0.96, 0.99, 1.04]   # gölgeler hafif soğuk
  isik_ton: [1.03, 1.0, 0.965]     # ışıklar hafif sıcak
  ton_guc: 1.0
  gren: 0.022
