# Sinematik paket 2: arka plan ordusu (godot/sahneler/kalabalik.gd). Senaryo niyetinde ortam.kalabalik: ordu ile
# istenir. Takımlar çekimdeki (aynı taraf) oyunculardan seçilir; sancak/nesne taşıyan tekil karakterler kullanılmaz.
# Uzak planda kalır (mesafe_m), yakın oyuncular tam animasyonlu çizilmeye devam eder. Poz: bekleme animasyonundan anlar.
kalabaliklar:
  ordu:
    adet: 130
    blok: 3
    saf_genislik: 15
    yan_aralik_m: 1.25
    sira_aralik_m: 1.6
    mesafe_m: [26.0, 70.0]
    yan_oran: 0.35
    poz_cesidi: 1
    kisi_carpani: 4          # gerçekçi insanlar açıkken her takımdan 4 farklı kişi pişirilir (kopya ordu görünmesin)
    en_cok_takim: 3
    animasyon: Idle_Loop
    golge: false
    sadelestir_oran: 0.10     # uzak kalabalıkta üçgenlerin ~%10'u (Godot LOD üreticisi); görünüm farkı yok, maliyet düşer

# Faz-65: toplu askerî ölçek ("ordu zafer elde etti") anlatan GENİŞ kadrajlı (mesafe uzak ya da yüksek/kuşbakışı kamera)
# 3D çekimde tek asker yerine birlik: rollerin toplam adedi en_az'ın altındaysa askerî rolün adedi hedef'e tamamlanır.
# Yeni rol/karakter/animasyon uydurulmaz: aynı rol, aynı uygun karakter havuzu (oyuncu_sec) ve aynı eylemle çoğalır;
# komutan/sivil çoğaltılmaz. Kökler küçük harf ve Türkçe harfler katlanmış; 'birlik' yalnız askerî biçimleriyle.
birlik:
  en_az: 4
  hedef: 6
  genis_kamera_en_az_yukseklik_m: 4.0
  haric_roller: [komutan, isci_sivil]
  kokler: [ordu, hucum, zafer, asker, kuvvet, muharebe, savas, akin, sefer, lejyon, suvariler, okcular, piyadeler, yeniceriler, saflar]
  kelimeler: [birlik, birlikler, birlikleri, birliklerini, birliklerin, birliklerle, birliklere]
  eylemler: [hucum, suvari_hucum, savas, savunma_hatti, toren_yuruyusu, carpisma]
