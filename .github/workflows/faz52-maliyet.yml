# Faz 5.2: arazi/ot deneylerinin render maliyeti — TÜM varyantlar AYNI runner'da sırayla (makine farkı ayrılır).
# Yalnızca faz51-altyapi dalında, deneyler/faz51/gorsel/kosu52.json değişince çalışır. Ölçüm işidir; yayın yok.
name: Faz52 maliyet olcumu

on:
  push:
    branches: [faz51-altyapi]
    paths: ["deneyler/faz51/gorsel/kosu52.json"]

permissions:
  contents: write

env:
  GODOT: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
  PROFIL_DOSYASI: profiller_52.json
  DENEY_PROJE: /tmp/gv52

jobs:
  olc:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Kurulum
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth ffmpeg libgl1-mesa-dri libglu1-mesa > /dev/null
          pip install --quiet psutil
          curl -sSLo /tmp/g.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  /tmp/g.zip" | sha512sum -c -
          unzip -q /tmp/g.zip -d /tmp/godot
          mkdir -p /tmp/motor_onbellek && cp -r deneyler/faz51/altyapi/onbellek/* /tmp/motor_onbellek/
      - name: Aynı makinede sırayla render
        run: |
          cd deneyler/faz51/gorsel
          for c in "S4a 45" "S1 36" "S2 75"; do set -- $c
            for p in D0 D3 D11; do python3 render_profil.py $1 $p $2 /tmp/m; done
          done
          EK=_tekrar python3 render_profil.py S4a D0 45 /tmp/m
          EK=_tekrar python3 render_profil.py S4a D11 45 /tmp/m
      - name: Sonucu dala yaz
        if: always()
        run: |
          D=deneyler/faz51/gorsel/sonuc52
          mkdir -p "$D"
          cp /tmp/m/*.json "$D"/ 2>/dev/null || true
          rm -f "$D"/*.is.json
          git config user.name "faz51-olcum"
          git config user.email "actions@users.noreply.github.com"
          git add "$D"
          git commit -m "Faz 5.2 maliyet ölçümü [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
