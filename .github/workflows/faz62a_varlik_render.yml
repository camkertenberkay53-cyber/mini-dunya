# Faz-62a — CI'da 3D varlık derleme + önbellek + Godot render hattı (doğrulama).
#
# Bu iş akışı Gemini KULLANMAZ, YouTube'a veya başka bir yere YÜKLEME YAPMAZ. Amaç, Faz-62b'deki gerçek üretimden
# önce 3D varlıkların (insan/karakter3/ekipman/takim/mekan/binek) CI'da Blender (bpy) ile derlenebildiğini,
# önbelleğe alınabildiğini ve Godot + Piper + FFmpeg hattının Otlukbeli pilotuyla uçtan uca .mp4 üretebildiğini
# kanıtlamaktır. Çıktı: 7 gün saklanan Actions artifact'ı (video + ölçüm/kalite raporları).
#
# Tetikleme: elle (Actions → "Faz62a varlık + render hattı" → Run workflow) ve doğrulama için yalnızca
# faz62a-ci-varlik-render dalına bu hattın dosyaları değiştiğinde push. Ücretli API ya da secret kullanılmaz.
name: Faz62a varlık + render hattı

on:
  workflow_dispatch:
    inputs:
      pilot:
        description: "motor/uretim/pilotlar altındaki pilot klasörü"
        required: false
        default: "otlukbeli-1473"
      varlik_yeniden:
        description: "Varlık önbelleğini yok say ve yeniden derle"
        type: boolean
        required: false
        default: false
  push:
    branches: [faz62a-ci-varlik-render]
    paths:
      - ".github/workflows/faz62a_varlik_render.yml"
      - "araclar/faz62a_hat.py"

permissions:
  contents: read

concurrency:
  group: faz62a-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
  MOTOR_ONBELLEK: /tmp/motor_onbellek
  MOTOR_KAYNAK: /tmp/varlik
  PIPER_MODELS: ${{ github.workspace }}/models
  CIKTI: /tmp/faz62a_cikti
  # MPFB2 (MakeHuman, GPL-3.0 eklenti kodu; insan gövdeleri CC0): gerçekçi insan derlemesinin kullandığı sürüm.
  # Yerel geliştirme ortamındaki kurulumla git ağaç karması birebir eşleşen commit (2026-11-22, PR #468).
  MPFB_COMMIT: 650c5c53bd6989a8ac264f31fa1d11d4a0c7bd8a

jobs:
  hat:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Kurulum (paketler, bpy 5.3.0, Godot 4.7.2 SHA512 doğrulamalı)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb xauth libgl1-mesa-dri libglu1-mesa libxi6 libxkbcommon0 libsm6 \
            libxrender1 libxxf86vm1 libxfixes3 libgl1 libegl1 fonts-dejavu-core libsndfile1 > /dev/null
          pip install --quiet -r requirements.txt
          pip install --quiet psutil jsonschema bpy==5.3.0
          python3 -c "import bpy; print('bpy', bpy.app.version_string)"
          curl -sSLo /tmp/g.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  /tmp/g.zip" | sha512sum -c -
          unzip -q /tmp/g.zip -d /tmp/godot && rm /tmp/g.zip
          nproc; free -g; df -h /

      - name: MPFB2 eklentisi (sabit commit; bpy kullanıcı eklenti deposu)
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          git -C "$d" init -q
          git -C "$d" remote add origin https://github.com/makehumancommunity/mpfb2
          git -C "$d" fetch -q --depth 1 origin "$MPFB_COMMIT"
          git -C "$d" checkout -q FETCH_HEAD
          [ "$(git -C "$d" rev-parse HEAD)" = "$MPFB_COMMIT" ]
          hedef="$HOME/.config/blender/5.3/extensions/user_default/mpfb"
          mkdir -p "$(dirname "$hedef")"
          rm -rf "$hedef" && cp -r "$d/src/mpfb" "$hedef" && rm -rf "$d"
          python3 -c "import bpy; import addon_utils; addon_utils.enable('bl_ext.user_default.mpfb', default_set=True); import importlib; importlib.import_module('bl_ext.user_default.mpfb.services.humanservice'); print('MPFB etkin')"

      - name: Ses modelleri önbelleği (Piper fahrettin + Whisper base)
        uses: actions/cache@v4
        with:
          path: models
          key: faz62a-ses-modelleri-v1

      - name: Ses modellerini indir (yoksa)
        run: |
          set -euo pipefail
          mkdir -p models && cd models
          [ -d vits-piper-tr_TR-fahrettin-medium ] || { curl -sSL -o m.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-tr_TR-fahrettin-medium.tar.bz2
            tar xjf m.tar.bz2 && rm m.tar.bz2; }
          [ -d sherpa-onnx-whisper-base ] || { curl -sSL -o w.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-base.tar.bz2
            tar xjf w.tar.bz2 && rm w.tar.bz2; }
          ls

      - name: Varlık anahtarı
        id: anahtar
        run: echo "anahtar=$(python3 araclar/faz62a_hat.py anahtar)" >> "$GITHUB_OUTPUT"

      - name: Kaynak depo önbelleği (CC0, sabit commit)
        uses: actions/cache@v4
        with:
          path: /tmp/varlik
          key: faz62a-kaynak-${{ hashFiles('motor/varlik/kaynaklar.yaml') }}

      - name: Kaynak depoları (sabit commit'ten sığ klon)
        run: python3 -u araclar/faz62a_hat.py kaynaklar --cikti "$CIKTI"

      - name: Varlık önbelleği
        id: varlik_onbellek
        if: ${{ !inputs.varlik_yeniden }}
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/motor_onbellek/ekipman
            /tmp/motor_onbellek/karakter3
            /tmp/motor_onbellek/insan
            /tmp/motor_onbellek/takim
            /tmp/motor_onbellek/mekan
            /tmp/motor_onbellek/binek
            /tmp/motor_onbellek/denetim
            motor/varlik/ekipman_kaydi.json
            motor/varlik/mekan_varlik_kaydi.json
          key: faz62a-varlik-${{ steps.anahtar.outputs.anahtar }}

      - name: Varlıkları derle (Blender/bpy; önbellek isabetinde değişmeyen girdiler yeniden derlenmez)
        run: python3 -u araclar/faz62a_hat.py varlik --cikti "$CIKTI"

      - name: Varlık önbelleğini kaydet
        if: ${{ steps.varlik_onbellek.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/motor_onbellek/ekipman
            /tmp/motor_onbellek/karakter3
            /tmp/motor_onbellek/insan
            /tmp/motor_onbellek/takim
            /tmp/motor_onbellek/mekan
            /tmp/motor_onbellek/binek
            /tmp/motor_onbellek/denetim
            motor/varlik/ekipman_kaydi.json
            motor/varlik/mekan_varlik_kaydi.json
          key: faz62a-varlik-${{ steps.anahtar.outputs.anahtar }}

      - name: Godot içe aktarma
        run: |
          set -o pipefail
          "$GODOT" --headless --path motor/godot --import > /tmp/ice.log 2>&1 || { tail -40 /tmp/ice.log; exit 1; }
          tail -3 /tmp/ice.log

      - name: Uçtan uca render doğrulaması (planla → Godot render → Piper TTS → FFmpeg kurgu → kalite kontrol)
        run: python3 -u araclar/faz62a_hat.py render --cikti "$CIKTI" --pilot "${{ inputs.pilot || 'otlukbeli-1473' }}"

      - name: Özet (Actions Summary)
        if: always()
        run: |
          python3 - <<'E' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          c = pathlib.Path("/tmp/faz62a_cikti")
          print("## Faz-62a varlık + render hattı\n")
          for ad in ("kaynaklar", "varlik", "render"):
              p = c / f"faz62a_{ad}.json"
              if not p.exists():
                  print(f"- **{ad}**: çalışmadı"); continue
              r = json.loads(p.read_text())
              print(f"- **{ad}**: {'✅ geçti' if r.get('gecti') else '❌ kaldı'} ({r.get('toplam_sn')} sn)")
              if ad == "varlik":
                  for k, v in r.get("klasorler", {}).items():
                      print(f"  - `{k}`: {v['dosya']} GLB, {v['mb']} MB")
              if ad == "render" and r.get("mp4"):
                  m = r["mp4"]
                  print(f"  - video: {m['cozunurluk'][0]}×{m['cozunurluk'][1]}, {m['sure_sn']} sn, {m['boyut_mb']} MB, ses: {m['ses']}")
                  print(f"  - kurgu durumu: {r['kurgu'].get('durum')}; render+kurgu {r['kurgu'].get('sure_sn')} sn")
          E

      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faz62a-varlik-render
          path: |
            /tmp/faz62a_cikti/*.json
            /tmp/faz62a_cikti/video/*.mp4
            /tmp/motor_onbellek/kurgu/*/uretim_raporu.json
            /tmp/ice.log
          retention-days: 7
          if-no-files-found: warn
