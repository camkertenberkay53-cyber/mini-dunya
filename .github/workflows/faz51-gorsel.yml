# Faz 5.1 P2/P3: renk profili V1/V2 karşılaştırması ve Poly Haven CC0 varlık testi.
# Yalnızca faz51-altyapi dalında, deneyler/faz51/gorsel/kosu.json değişince çalışır.
# TEST/ÖLÇÜM işidir: yayın üretmez, hiçbir yere yüklemez. Üretim Godot projesi değişmez; V2 bir proje KOPYASINDA çalışır.
# Poly Haven dosyaları yalnızca Actions artifact'ı olarak kalır (3 gün); dala yalnız kayıt JSON'u, küçük önizleme ve paneller yazılır.
name: Faz51 gorsel deneyi

on:
  push:
    branches: [faz51-altyapi]
    paths: ["deneyler/faz51/gorsel/kosu.json"]

permissions:
  contents: write

env:
  GODOT: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

jobs:
  polyhaven:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: CC0 varlıkları indir ve kaydet
        run: |
          mkdir -p /tmp/ph
          python3 deneyler/faz51/gorsel/polyhaven.py /tmp/ph /tmp/ph/polyhaven_kayit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polyhaven
          path: /tmp/ph
          retention-days: 3

  render:
    needs: polyhaven
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cekim: [S1, S2, S4a]
        profil: [V0, V2, V2_PH]
        include:
          - {cekim: S1, kare: 36}
          - {cekim: S2, kare: 75}
          - {cekim: S4a, kare: 45}
    steps:
      - uses: actions/checkout@v4
      - name: Kurulum
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth ffmpeg libgl1-mesa-dri libglu1-mesa > /dev/null
          pip install --quiet psutil
          curl -sSLo /tmp/g.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  /tmp/g.zip" | sha512sum -c -
          unzip -q /tmp/g.zip -d /tmp/godot
          mkdir -p /tmp/motor_onbellek && cp -r deneyler/faz51/altyapi/onbellek/* /tmp/motor_onbellek/
          "$GODOT" --headless --path motor/godot --import > /tmp/ice.log 2>&1 || true
      - uses: actions/download-artifact@v4
        if: matrix.profil == 'V2_PH'
        with:
          name: polyhaven
          path: /tmp/ph
      - name: Render (${{ matrix.cekim }} / ${{ matrix.profil }})
        run: python3 deneyler/faz51/gorsel/render_profil.py ${{ matrix.cekim }} ${{ matrix.profil }} ${{ matrix.kare }} /tmp/g
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gorsel-${{ matrix.cekim }}-${{ matrix.profil }}
          path: |
            /tmp/g/*.png
            /tmp/g/${{ matrix.cekim }}_${{ matrix.profil }}.json
          retention-days: 3

  analiz:
    needs: [polyhaven, render]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Paketler
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install --quiet numpy pillow
      - uses: actions/download-artifact@v4
        with:
          pattern: gorsel-*
          merge-multiple: true
          path: /tmp/gir
      - uses: actions/download-artifact@v4
        with:
          name: polyhaven
          path: /tmp/ph
      - name: Analiz ve dala yaz
        run: |
          D=deneyler/faz51/gorsel/sonuc
          mkdir -p "$D/onizleme"
          python3 deneyler/faz51/gorsel/analiz.py /tmp/gir "$D"
          cp /tmp/ph/polyhaven_kayit.json "$D/" || true
          python3 - <<'E'
          from pathlib import Path
          from PIL import Image
          for p in Path("/tmp/ph").glob("*/*"):
              if p.suffix == ".jpg" and p.stem == "diff":
                  im = Image.open(p).convert("RGB"); im.thumbnail((256, 256))
                  im.save(f"deneyler/faz51/gorsel/sonuc/onizleme/{p.parent.name}.jpg", quality=80)
          E
          echo '{"run_id": "${{ github.run_id }}", "polyhaven": "${{ needs.polyhaven.result }}", "render": "${{ needs.render.result }}"}' > "$D/kosu.json"
          git config user.name "faz51-olcum"
          git config user.email "actions@users.noreply.github.com"
          git add "$D"
          git commit -m "Faz 5.1 görsel ölçümü [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
