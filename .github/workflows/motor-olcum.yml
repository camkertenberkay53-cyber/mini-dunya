# Faz 2: render ortamı ölçümü. Yalnızca motor-faz2 dalında, motorun render dosyaları değişince çalışır.
# Bu bir TEST/ÖLÇÜM işidir (motorun performans testi); video üretmez, hiçbir yere yüklemez.
name: Motor render olcumu

on:
  push:
    branches: [motor-faz2, motor-faz3]
    paths:
      - "motor/godot/**"
      - "motor/olcum/render_olc.py"
      - ".github/workflows/motor-olcum.yml"

concurrency:
  group: motor-olcum
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  olc:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Paketler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth ffmpeg libgl1-mesa-dri libglu1-mesa > /dev/null
          pip install --quiet psutil pyyaml

      - name: Godot 4.7.2 (resmi sürüm, SHA512 doğrulamalı)
        run: |
          curl -sSLo /tmp/g.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  /tmp/g.zip" | sha512sum -c -
          unzip -q /tmp/g.zip -d /tmp/godot
          echo "GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64" >> $GITHUB_ENV

      - name: Olcum (180 kare = 6 sn, 1080x1920, 30 fps)
        run: |
          nproc; free -g; df -h /
          if [ "${GITHUB_REF_NAME}" = "motor-faz3" ]; then
            # Faz 3: aynı sahne yükü, askerler dönem kitlerinden; karşılaştırma için Faz 2 sahnesi de aynı makinede
            MOTOR_ONBELLEK=/tmp/motor_onbellek python3 -m motor.olcum.render_olc github_actions_faz3 180 res://sahneler/olcum3.tscn
            MOTOR_ONBELLEK=/tmp/motor_onbellek python3 -m motor.olcum.render_olc github_actions_faz2_ayni_makine 180
          else
            MOTOR_ONBELLEK=/tmp/motor_onbellek python3 -m motor.olcum.render_olc github_actions 180
          fi

      - name: Sonucu dala yaz
        run: |
          git config user.name "motor-olcum"
          git config user.email "actions@users.noreply.github.com"
          git add motor/olcum/sonuc_github_actions*.json motor/olcum/kare_github_actions*.jpg
          git commit -m "Render olcumu: GitHub Actions sonucu [skip ci]" || exit 0
          git push
