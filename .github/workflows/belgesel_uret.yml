# Faz-62b/62c — otonom belgesel üretimi (YouTube'a ya da başka bir yere YÜKLEME YAPMAZ).
#
# Akış: varlik (Faz-62a önbelleği; yoksa Blender ile derlenir) → plan (araştırma havuzu + Commons CC0/PD 2.5D görselleri
# + Gemini senaryo → çekim planı → paralel parçalar) → render (PARALEL matris: biçim × parça) → kurgu (biçim başına:
# TTS → FFmpeg → kalite kapıları). Çıktı: .mp4 (+ uzun için .srt) + raporlar Actions artifact'ı (14 gün).
#
# Biçimler: 'shorts' (1080×1920, Faz-62b ile aynı), 'uzun' (1920×1080, 15–20 dk, 6–8 bölüm, SRT, müzik yatağı,
# loudnorm, bölüm geçişleri), 'her_ikisi' (aynı araştırma ve aynı görsellerle iki ayrı video).
#
# Tetikleme: yalnız elle (Actions → "Belgesel üret" → Run workflow). Gemini: GEMINI_API_KEY (Tier 1, faturalı).
# Ayrıca hat dalı push'larında Gemini'SİZ doğrulama koşusu: pilot senaryo + fikstür (Shorts) ve aynı cümlelerle 16:9
# motor doğrulaması (uzun; anlatı kapısı atlanır ve açıkça raporlanır) — secret kullanılmaz, üretim değildir.
name: Belgesel üret

on:
  workflow_dispatch:
    inputs:
      konu:
        description: "Tarihî konu başlığı"
        required: true
        default: "Otlukbeli Savaşı"
      mod:
        description: "Biçim"
        type: choice
        options: [shorts, uzun, her_ikisi]
        default: shorts
      parca_sayisi:
        description: "Paralel render iş sayısı (Shorts; uzun en az 8 kullanır)"
        required: false
        default: "4"
      altyazi_gom:
        description: "Uzun: altyazıyı videoya göm (SRT her durumda ayrı dosya olarak da verilir)"
        type: boolean
        default: false
  push:
    branches: [faz62b-otonom-uretim, faz62c-long-documentary-engine]
    paths:
      - ".github/workflows/belgesel_uret.yml"
      - ".github/actions/motor-ortami/action.yml"
      - "otonom_uret.py"
      - "deneyler/faz62b/dogrulama.json"
      - "motor/uretim/**"

permissions:
  contents: read

concurrency:
  group: belgesel-uret-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
  MOTOR_ONBELLEK: /tmp/motor_onbellek
  MOTOR_KAYNAK: /tmp/varlik
  PIPER_MODELS: ${{ github.workspace }}/models
  MPFB_COMMIT: 650c5c53bd6989a8ac264f31fa1d11d4a0c7bd8a
  IS: /tmp/otonom_is
  CIKTI: /tmp/otonom_cikti
  DOGRULAMA: ${{ github.event_name == 'push' }}

jobs:
  varlik:
    name: Varlıklar (önbellek ya da Blender derleme)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - id: ortam
        uses: ./.github/actions/motor-ortami
        with: {bpy: "true", mpfb: "true", varlik: istege-bagli}
      - name: Kaynak depo önbelleği
        if: ${{ steps.ortam.outputs.varlik_isabet != 'true' }}
        uses: actions/cache@v4
        with:
          path: /tmp/varlik
          key: faz62a-kaynak-${{ hashFiles('motor/varlik/kaynaklar.yaml') }}
      - name: Varlıkları derle (önbellek yoksa)
        if: ${{ steps.ortam.outputs.varlik_isabet != 'true' }}
        run: |
          python3 -u araclar/faz62a_hat.py kaynaklar --cikti "$CIKTI"
          python3 -u araclar/faz62a_hat.py varlik --cikti "$CIKTI"
      - name: Varlık önbelleğini kaydet
        if: ${{ steps.ortam.outputs.varlik_isabet != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/motor_onbellek/ekipman
            /tmp/motor_onbellek/karakter3
            /tmp/motor_onbellek/insan
            /tmp/motor_onbellek/takim
            /tmp/motor_onbellek/mekan
            /tmp/motor_onbellek/binek
            /tmp/motor_onbellek/denetim
            motor/varlik/ekipman_kaydi.json
            motor/varlik/mekan_varlik_kaydi.json
          key: faz62a-varlik-${{ steps.ortam.outputs.varlik_anahtari }}

  plan:
    name: Plan (araştırma + görseller + senaryo + çekim planı)
    needs: varlik
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      kimlik: ${{ steps.plan.outputs.kimlik }}
      kimlikler: ${{ steps.plan.outputs.kimlikler }}
      matris: ${{ steps.plan.outputs.matris }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/motor-ortami
        with: {bpy: "true", ses: "true", varlik: gerekli}   # bpy: plan denetimi binek GLB'lerini istek üzerine üretir
      - name: Plan
        id: plan
        env:
          GEMINI_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.GEMINI_API_KEY || '' }}
          OPENALEX_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.OPENALEX_API_KEY || '' }}
          KONU: ${{ inputs.konu || 'Otlukbeli Savaşı' }}
          PARCA: ${{ inputs.parca_sayisi || '3' }}
          MOD: ${{ inputs.mod || 'shorts' }}
        run: |
          if [ "$DOGRULAMA" = "true" ]; then
            python3 -u otonom_uret.py dogrula --fikstur deneyler/faz62b/dogrulama.json \
              --is "$IS" --cikti "$CIKTI" --parca-sayisi "$PARCA"
          else
            python3 -u otonom_uret.py planla --konu "$KONU" --mod "$MOD" \
              --is "$IS" --cikti "$CIKTI" --parca-sayisi "$PARCA"
          fi
      - name: Plan artifact'ı
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: ${{ env.IS }}
          retention-days: 14
          if-no-files-found: error
      - name: Binek artifact'ı (plan sırasında üretilen GLB'ler; render/kurgu aynı dosyaları kullanır)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: binek
          path: /tmp/motor_onbellek/binek
          retention-days: 3
          if-no-files-found: ignore
      - name: 2.5D görseller artifact'ı
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gorseller
          path: assets/tarihi_gorsel
          retention-days: 14
          if-no-files-found: ignore
      - name: Plan raporu artifact'ı
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapor-plan
          path: ${{ env.CIKTI }}/*.json
          retention-days: 14
          if-no-files-found: warn

  render:
    name: Render (${{ matrix.kimlik }} · parça ${{ matrix.parca }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matris) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/motor-ortami
        with: {bpy: "true", godot: "true", varlik: gerekli}
      - uses: actions/download-artifact@v4
        with: {name: plan, path: "${{ env.IS }}"}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: binek, path: /tmp/motor_onbellek/binek}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: gorseller, path: assets/tarihi_gorsel}
      - name: Render
        run: |
          python3 -u otonom_uret.py render --is "$IS" --kimlik "${{ matrix.kimlik }}" \
            --parca "${{ matrix.parca }}" --cikti "$CIKTI"
      - name: Render artifact'ı
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.kimlik }}-${{ matrix.parca }}
          path: /tmp/motor_onbellek/uretim/${{ matrix.kimlik }}
          retention-days: 3
          if-no-files-found: warn

  kurgu:
    name: Kurgu (${{ matrix.kimlik }})
    needs: [plan, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        kimlik: ${{ fromJSON(needs.plan.outputs.kimlikler) }}
    env:
      ALTYAZI_GOM: ${{ inputs.altyazi_gom && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/motor-ortami
        with: {bpy: "true", godot: "true", ses: "true", varlik: gerekli}
      - uses: actions/download-artifact@v4
        with: {name: plan, path: "${{ env.IS }}"}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: gorseller, path: assets/tarihi_gorsel}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: binek, path: /tmp/motor_onbellek/binek}
      - uses: actions/download-artifact@v4
        with:
          pattern: render-${{ matrix.kimlik }}-*
          merge-multiple: true
          path: /tmp/motor_onbellek/uretim/${{ matrix.kimlik }}
      - name: Kurgu
        run: |
          python3 -u otonom_uret.py kurgu --is "$IS" --kimlik "${{ matrix.kimlik }}" --cikti "$CIKTI"
      - name: Özet
        if: always()
        env:
          KIMLIK: ${{ matrix.kimlik }}
        run: |
          python3 - <<'E' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          c = pathlib.Path("/tmp/otonom_cikti")
          kim = os.environ["KIMLIK"]
          k = c / f"otonom_kurgu_{kim}.json"
          print(f"## Belgesel üret — {kim}\n")
          if os.environ.get("DOGRULAMA") == "true":
              print("> Doğrulama koşusu: Gemini kullanılmadı (pilot senaryo + fikstür). Bu bir üretim çıktısı değildir"
                    + (" — uzun: yalnız 16:9 MOTOR doğrulaması, 15–20 dk anlatı değil." if kim.endswith("-uzun") else ".") + "\n")
          if not k.exists():
              print("Kurgu raporu yok."); raise SystemExit
          r = json.loads(k.read_text())
          print(f"- biçim: {r.get('format')} · durum: **{r.get('durum')}** ({'✅' if r.get('gecti') else '❌'}), "
                f"kurgu {r.get('sure_sn')} sn")
          if r.get("neden"):
              print(f"- neden: {r.get('neden')} {r.get('eksik') or ''}")
          m = r.get("mp4")
          if m:
              print(f"- video: `{pathlib.Path(m['yol']).name}` — {m['cozunurluk'][0]}×{m['cozunurluk'][1]}, "
                    f"{m['sure_sn']} sn ({m['sure_sn'] / 60:.1f} dk), {m['boyut_mb']} MB, ses: {m['ses']}")
          if r.get("srt_dosyasi"):
              print(f"- altyazı: `{pathlib.Path(r['srt_dosyasi']).name}` (gömülü: {r.get('altyazi_gomulu')})")
          for b in r.get("bolumler") or []:
              print(f"  - {b['id']} {b['baslik']}: {b['bas']:.0f}–{b['son']:.0f} sn")
          kk = r.get("kalite_kontrol") or {}
          if kk:
              print(f"- kalite kapıları: {json.dumps(kk, ensure_ascii=False)[:900]}")
          E
      - name: Video artifact'ı
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.kimlik }}
          path: |
            ${{ env.CIKTI }}/video/*.mp4
            ${{ env.CIKTI }}/video/*.srt
            ${{ env.CIKTI }}/video/*.json
            ${{ env.CIKTI }}/*.json
          retention-days: 14
          if-no-files-found: warn
