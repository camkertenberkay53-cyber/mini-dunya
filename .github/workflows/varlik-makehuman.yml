# OpenGameArt CC0 varlıklarını (lisans sayfadan doğrulanarak) üretim varlık klasörüne indirir.
# Yalnızca faz51-altyapi dalında, motor/varlik/makehuman/istek.json değişince çalışır.
name: Varlik MakeHuman

on:
  push:
    branches: [faz51-altyapi]
    paths: ["motor/varlik/makehuman/istek.json"]

permissions:
  contents: write

jobs:
  indir:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m motor.varlik.makehuman_indir motor/varlik/makehuman/istek.json
      - name: Boyut ve dala yaz
        run: |
          du -sh motor/varlik/makehuman/*
          git config user.name "varlik-oga"
          git config user.email "actions@users.noreply.github.com"
          git add motor/varlik/makehuman
          git commit -m "OpenGameArt CC0 varlıkları (lisans kaydıyla) [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
