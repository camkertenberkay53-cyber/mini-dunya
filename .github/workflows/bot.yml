name: Mini Dunya Bot

on:
  schedule:
    # Her saat kontrol: zamanı gelmiş ama yapılmamış slot varsa üretir (GitHub bir çalıştırmayı kaçırırsa telafi eder).
    # Yayın saatleri (TR): ~10:00, 12:30, 16:00, 18:30; Pazar ~10:00 uzun video. İngilizce sürüm ABD saatine zamanlanır.
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      gorev:
        description: "Ne yapılsın?"
        type: choice
        default: test
        options: [otomatik, test, sabah, oglen, aksam, gece, uzun, fikir, ingilizce, rakip, rapor, durum, kanal, katalog, boya_test, yonetmen, veo_test]
      zorla:
        description: "Bugün bu slot yapılmış olsa da yeniden üret"
        type: boolean
        default: false

concurrency:
  group: mini-dunya
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # her zaman en güncel hafıza: aynı bölüm iki kez üretilmesin

      - name: Görevi belirle
        id: gorev
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.gorev }}" = "otomatik" ]; then
            G=$(python3 -m kaos.due)
          else
            G="${{ github.event.inputs.gorev }}"
          fi
          echo "gorev=$G" >> "$GITHUB_OUTPUT"
          echo "Görev: $G"

      - uses: actions/setup-python@v5
        if: steps.gorev.outputs.gorev != 'none'
        with:
          python-version: "3.13"
          cache: pip

      - name: Kurulum
        if: steps.gorev.outputs.gorev != 'none'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libxi6 libxkbcommon0 libsm6 libxrender1 libxxf86vm1 libxfixes3 libgl1 libegl1 > /dev/null
          pip install -q -r requirements.txt
          pip install -q bpy || echo "bpy kurulamadı: 3D kapalı, 2D ile devam" 

      - name: Yedek ses modelleri (önbellek)
        if: steps.gorev.outputs.gorev != 'none'
        uses: actions/cache@v4
        with:
          path: models
          key: piper-tr-v1

      - name: Yedek ses modellerini indir
        if: steps.gorev.outputs.gorev != 'none'
        run: |
          mkdir -p models && cd models
          for v in fahrettin-medium fettah-medium dfki-medium; do
            if [ ! -d "vits-piper-tr_TR-$v" ]; then
              curl -sSL -o m.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-tr_TR-$v.tar.bz2"
              tar xjf m.tar.bz2 && rm m.tar.bz2
            fi
          done

      - name: Bölümü üret ve yükle
        if: steps.gorev.outputs.gorev != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_KEY: ${{ secrets.GEMINI_IMAGE_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          PIPER_MODELS: ${{ github.workspace }}/models
        run: |
          G="${{ steps.gorev.outputs.gorev }}"
          FORCE=""
          if [ "${{ github.event.inputs.zorla }}" = "true" ]; then FORCE="--force"; fi
          if [ "$G" = "fikir" ]; then
            python -m kaos.main --fikir
          elif [ "$G" = "kanal" ]; then
            python -m kaos.main --kanal-kurulum
          elif [ "$G" = "durum" ]; then
            python -m kaos.durum
          elif [ "$G" = "rakip" ]; then
            python -m kaos.rakip
            python -m kaos.rapor || echo "Rapor atlandı"
          elif [ "$G" = "yonetmen" ]; then
            AID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=40" --jq '[.artifacts[] | select((.name | test("^video-(sabah|oglen|aksam|gece|otomatik)-")) and .size_in_bytes > 1000000 and (.expired | not))][0].id')
            mkdir -p output/son && gh api "repos/${{ github.repository }}/actions/artifacts/$AID/zip" > /tmp/son.zip && unzip -oq /tmp/son.zip -d output/son
            python -m kaos.yonetmen
          elif [ "$G" = "veo_test" ]; then
            python -m kaos.veo
          elif [ "$G" = "boya_test" ]; then
            python -m kaos.boya
          elif [ "$G" = "rapor" ]; then
            python -m kaos.rapor
          elif [ "$G" = "ingilizce" ]; then
            python -m kaos.main --en-telafi
          elif [ "$G" = "katalog" ]; then
            python -m kaos.catalog
          elif [ "$G" = "test" ]; then
            python -m kaos.main --slot sabah --no-upload --force
          else
            python -m kaos.main --slot "$G" $FORCE
          fi

      - name: Videoyu indirilebilir yap
        if: always() && steps.gorev.outputs.gorev != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.gorev.outputs.gorev }}-${{ github.run_number }}
          path: |
            output/**/video.mp4
            output/**/kapak.jpg
            output/**/senaryo.json
            output/**/yonetmen.json
            output/**/kare_*.jpg
            output/**/arka_plan.png
            output/boya_test/*.jpg
          retention-days: 14
          if-no-files-found: ignore

      - name: Hikâye hafızasını kaydet
        if: success() && steps.gorev.outputs.gorev != 'test' && steps.gorev.outputs.gorev != 'katalog' && steps.gorev.outputs.gorev != 'none' && steps.gorev.outputs.gorev != 'durum'
        run: |
          git config user.name "mini-dunya-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state episodes evren
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Bölüm kaydı: ${{ steps.gorev.outputs.gorev }} $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
