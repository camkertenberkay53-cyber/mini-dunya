uzun:
  hafta1_pazar: 'Buzdolabından Kaçış: haritacılar buzdolabının içinde mahsur kalır,
    ışık söner, Benek''in yardımıyla büyük kaçış.'
  hafta2_pazar: 'Kutu Şehrinin Sırrı: tadilat kolilerinin içinde kaybolurlar, İlk
    Haritacı''nın gizli işaretini çözerler.'
