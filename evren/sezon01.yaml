ad: 'Sezon 1: Mutfak Kıtası'
ana_hikaye: Devler mutfağı tadilata alıyor. Lonca, mutfak değişmeden önce haritasını çıkarmak için dört haritacıyı
  gönderir. 14 gün sonra mutfak değişecek; keşfedilmeyen her yer kaybolacak.
# ANA GİZEM: izleyiciye soru olarak sunulur; cevap sadece final gününde açılır.
gizem: Yüz yıl önce İlk Haritacı mutfakta kaybolurken Lonca'nın Pusula Taşı'nı da yanında götürmüştü. Mutfağın dört bir
  yanına kazınmış küçük ok işaretleri kime ait ve nereyi gösteriyor?
gizem_cozumu: Ok işaretlerini İlk Haritacı bırakmış. Hepsi birleşince Pusula Taşı'nın tadilat kolilerinin dibindeki eski
  bir kibrit kutusunda saklandığını gösteriyor. Taş bulunduğunda iğnesi mutfağı değil, bahçe kapısını, yani evin dışını gösteriyor.
karakter_yolculugu:
  tuna: Aceleciliği ekibi iki kez zora sokar; sabırlı bir lider olmayı öğrenir.
  nil: Plansız kaldığında donup kalır; buzdolabındaki hatasından sonra doğaçlama yapmayı öğrenir.
  bulut: Yükseklikten korkar; finalde Pusula Taşı'na ulaşmak için en yükseğe kendisi tırmanır.
  pire: Hep yanlışlıkla bir şeyler başlatır; Ela anında tek başına doğru kararı verip ekibi kurtarır.
gunler:
- gun: 1
  bolge: "Süpürgelik çıkışı"
  odak: "tuna"
  sabah: "[Süpürgelik çıkışı] Lonca görevi verir, mutfak tadilatı haberi. İlk adım ve ilk tehlike: dev süpürgenin rüzgârı."
  oglen: "[Süpürgelik çıkışı] Yan macera: çıkıştaki dev toz yığınlarında kaybolan bir alet."
  aksam: "[Süpürgelik çıkışı] Kapı menteşesinde mahsur kalma ve kurtuluş; Tezgah Ovası uzaktan görünür."
  gece: "[Süpürgelik çıkışı] Karakter odaklı komik yan macera: ilk gece kampı."
  ipucu: "Süpürgeliğin dibinde, eski ve minicik bir ok işareti fark edilir ama kimse önemsemez."
- gun: 2
  bolge: "Tezgah Ovası"
  odak: "pire"
  sabah: "[Tezgah Ovası] Ekmek kırıntısı çölü ve şeker küpü kayaları; tezgâha ilk tırmanış."
  oglen: "[Tezgah Ovası] Yan macera: reçel gölüne yakalanan alet çantası."
  aksam: "[Tezgah Ovası] Kırıntı çölünden çıkış ve tezgâhın haritası."
  gece: "[Tezgah Ovası] Karakter odaklı komik yan macera."
  ipucu: "Şeker küpünün üstünde aynı ok işaretinden bir tane daha; Nil iki okun aynı yöne baktığını fark eder."
- gun: 3
  bolge: "Lavabo Gölü"
  odak: "bulut"
  sabah: "[Lavabo Gölü] Damlayan musluk; Bulut süngerden sal yapar, göl geçilmeye çalışılır."
  oglen: "[Lavabo Gölü] Yan macera: köpük adaları, sabun kaydırağı ya da dev diş fırçası."
  aksam: "[Lavabo Gölü] Gölün öbür kıyısına varış; musluk dibinde gizli bir oyuk."
  gece: "[Lavabo Gölü] Karakter odaklı komik yan macera."
  ipucu: "Musluğun dibindeki oyukta üçüncü ok ve yanında yarım kalmış bir imza: 'İlk H...'."
- gun: 4
  bolge: "Baharat Raflı Dağları"
  odak: "nil"
  sabah: "[Baharat Rafı] Raf dağlarına tırmanış; biber tozu fırtınası."
  oglen: "[Baharat Rafı] Yan macera: tarçın kütükleri ya da yıldız anason labirenti."
  aksam: "[Baharat Rafı] Zirvede mutfağın tamamı görünür; Nil okların bir harita oluşturduğunu düşünür."
  gece: "[Baharat Rafı] Karakter odaklı komik yan macera."
  ipucu: "Zirveden bakınca okların hepsi aynı köşeye, kapının yanındaki koli yığınına bakıyor gibi."
- gun: 5
  bolge: "Buzdolabı Kutbu"
  odak: "tuna"
  sabah: "[Buzdolabı] Kapı açıkken içeri dalış; Tuna'nın aceleciliği yüzünden mahsur kalırlar."
  oglen: "[Buzdolabı] Yan macera: peynir mağaraları ya da yumurta kayalıkları."
  aksam: "[Buzdolabı] Soğuk ve karanlık bastırır; bir planın ilk parçası."
  gece: "[Buzdolabı] Karakter odaklı komik yan macera."
  ipucu: "Buzlu camın üstünde, donmuş bir ok işareti; demek İlk Haritacı buraya da girmiş."
- gun: 6
  bolge: "Buzdolabı Kutbu (2)"
  odak: "nil"
  sabah: "[Buzdolabı] Işık söner; Nil'in planı ilk kez işe yaramaz."
  oglen: "[Buzdolabı] Yan macera: buz küpü kızakları."
  aksam: "[Buzdolabı] Nil doğaçlama yapar, Benek'in ışıklı kanatlarıyla kaçış; kapı açıldığı an dışarı."
  gece: "[Buzdolabı] Karakter odaklı komik yan macera."
  ipucu: "Kaçarken Nil donmuş okun altındaki tarih yazısını okur; yüz yıl önce."
- gun: 7
  bolge: "Karınca Yolu"
  odak: "pire"
  sabah: "[Karınca Yolu] Karınca kervanıyla karşılaşma; yanlış anlama."
  oglen: "[Karınca Yolu] Yan macera: kervanla şeker pazarlığı."
  aksam: "[Karınca Yolu] Yaşlı karınca, okları çizen minik gezgini hatırladığını söyler."
  gece: "[Karınca Yolu] Karakter odaklı komik yan macera."
  ipucu: "Karıncalar İlk Haritacı'yı 'pusulalı gezgin' diye anıyor; elinde parlayan bir taş varmış."
- gun: 8
  bolge: "Fırın Vadisi"
  odak: "bulut"
  sabah: "[Fırın Vadisi] Fırının sıcak hava akımı; Bulut'un uçan peçete planörü."
  oglen: "[Fırın Vadisi] Yan macera: fırın eldiveni dağı."
  aksam: "[Fırın Vadisi] Sıcak akımla uçarak koli yığınının üstünden geçerler."
  gece: "[Fırın Vadisi] Karakter odaklı komik yan macera."
  ipucu: "Havadan bakınca bir kolinin üstünde dev bir ok şekli görülür; okların hepsi buraya çıkıyor."
- gun: 9
  bolge: "Çekmece Mağaraları"
  odak: "tuna"
  sabah: "[Çekmece] Çatal bıçak ormanı; Benek kaybolur."
  oglen: "[Çekmece] Yan macera: lastik bant sapanı."
  aksam: "[Çekmece] Tuna ilk kez acele etmez, ekibi bekler ve Benek bulunur."
  gece: "[Çekmece] Karakter odaklı komik yan macera."
  ipucu: "Benek'in saklandığı yerde, eski bir kibrit çöpüne kazınmış harita parçası."
- gun: 10
  bolge: "Kedi Mama Kabı"
  odak: "pire"
  sabah: "[Zemin] Ev kedisi Paşa ile ilk karşılaşma; dağ gibi bir canlı."
  oglen: "[Zemin] Yan macera: mama kabı kayalıkları."
  aksam: "[Zemin] Paşa aslında meraklı ve zararsız çıkar; yeni bir dost."
  gece: "[Zemin] Karakter odaklı komik yan macera."
  ipucu: "Paşa'nın tasmasında da aynı ok sembolü var; kedi koli yığınının yanında uyumayı seviyor."
- gun: 11
  bolge: "Ela'nın sandalyesi"
  odak: "pire"
  sabah: "[Tezgâh/Sandalye] Ela neredeyse onları görüyor; donup kalma oyunu."
  oglen: "[Sandalye] Yan macera: boya kalemi köprüsü."
  aksam: "[Sandalye] Pire tek başına doğru kararı verir, ekibi Ela'dan saklar."
  gece: "[Sandalye] Karakter odaklı komik yan macera."
  ipucu: "Ela'nın çizdiği resimde minik bir gezgin ve parlayan bir taş var; Ela da bir şey görmüş olabilir."
- gun: 12
  bolge: "Tadilat başlıyor"
  odak: "nil"
  sabah: "[Tezgah] Devler eşyaları kolilere koyuyor; haritayı yetiştirme yarışı."
  oglen: "[Zemin] Yan macera: kayan koliler."
  aksam: "[Lonca] Nil bütün okları Büyük Harita'ya işler; hepsi tek noktada birleşir."
  gece: "[Lonca] Karakter odaklı komik yan macera."
  ipucu: "Okların birleştiği nokta kesinleşir; ama orası artık kolilerle kapatılmak üzere."
- gun: 13
  bolge: "Kutu Şehri"
  odak: "tuna"
  sabah: "[Zemin] Kolilerin içine giriş; karton koridorlar."
  oglen: "[Zemin] Yan macera: koli bandı bataklığı."
  aksam: "[Zemin] En dipte eski bir kibrit kutusu bulunur; içinden ışık sızıyor."
  gece: "[Zemin] Karakter odaklı komik yan macera."
  ipucu: "Kibrit kutusunun üstünde tam imza: 'İlk Haritacı'."
- gun: 14
  bolge: "Final"
  odak: "bulut"
  sabah: "[Zemin] Kibrit kutusu en tepedeki koliye kaldırılmış; Bulut korkusuna rağmen tırmanır."
  oglen: "[Lonca] Yan macera: Lonca harita kutlaması hazırlığı."
  aksam: "[Lonca] FİNAL: Pusula Taşı bulunur, gizem çözülür; iğne evin dışını gösterir."
  gece: "[Lonca] Karakter odaklı sıcak kapanış: mutfak haritası tamamlanır."
  ipucu: "GİZEM ÇÖZÜLÜR (gizem_cozumu bu gün açıklanabilir)."
uzun:
  hafta1_pazar: 'Buzdolabından Büyük Kaçış: ekip buzdolabında mahsur kalır, ışık söner, Nil ilk kez doğaçlama yapar;
    kaçış sırasında donmuş ok işareti ve yüz yıllık tarih bulunur.'
  hafta2_pazar: 'Kutu Şehrinin Sırrı: tadilat kolilerinin içinde kaybolurlar, okları takip ederek İlk Haritacı''nın
    kibrit kutusuna ulaşırlar; Pusula Taşı ve evin dışını gösteren iğne.'
