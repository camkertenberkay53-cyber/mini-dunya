ad: 'Sezon 1: Mutfak Kıtası'
ana_hikaye: Devler mutfağı tadilata alıyor. Lonca, mutfak değişmeden önce haritasını
  çıkarmak için dört haritacıyı gönderir. 14 gün sonra mutfak değişecek; keşfedilmeyen
  her yer kaybolacak.
gunler:
- gun: 1
  bolge: Süpürgelik çıkışı
  sabah: '[Süpürgelik çıkışı] Ana yolculuk, günün başlangıcı: Görev verilir; ilk adım
    ve ilk tehlike: süpürge.'
  oglen: '[Süpürgelik çıkışı] Aynı bölgede bağımsız yan macera (kategori bot seçer).'
  aksam: '[Süpürgelik çıkışı] Ana yolculuk, günün sonucu ve yeni merak: Görev verilir;
    ilk adım ve ilk tehlike: süpürge.'
  gece: '[Süpürgelik çıkışı] Karakter odaklı komik yan macera.'
