# MİNİ DÜNYA bot ayarları

kanal:
  ad: MİNİ DÜNYA
  dil: tr

yayin:
  # public = hemen yayınla, private = gizli yükle (önce izleyip elle açarsın), unlisted = liste dışı
  gizlilik: public
  yukle: true            # false yapılırsa video sadece üretilir, GitHub'dan indirilir
  kategori: 1            # Film ve Animasyon
  shorts_etiketleri: ["mini dünya", "animasyon", "macera", "keşif", "çizgi film", "shorts"]

senaryo:
  # Ücretsiz Gemini metin modelleri (sırayla denenir; hiçbiri olmazsa uygun model otomatik bulunur)
  modeller: ["gemini-flash-latest", "gemini-3.8-flash", "gemini-2.0-flash"]
  kalite_kontrol: true

tts:
  order: [gemini, edge, piper]
  gemini_models: ["gemini-2.5-flash-preview-tts", "gemini-3.1-flash-tts-preview"]

# Karakter sesleri. Ses kataloğu videosunu izledikten sonra beğendiğin sesleri buraya yazarız.
voices:
  tuna:
    gemini: Puck
    style: "Cesur, enerjik ve kendinden emin genç bir maceracı gibi; hevesli, hızlı ve gülümseyerek konuş."
    edge: {voice: tr-TR-AhmetNeural, rate: "+8%", pitch: "+14Hz"}
    piper: {voice: fahrettin-medium, speed: 1.05, pitch: 1.08}
  nil:
    gemini: Kore
    style: "Zeki, sakin ve net konuşan genç bir kız gibi; kuru espri yapar gibi, ölçülü ve tane tane konuş."
    edge: {voice: tr-TR-EmelNeural, rate: "+0%", pitch: "+6Hz"}
    piper: {voice: dfki-medium, speed: 1.0, pitch: 1.25}
  bulut:
    gemini: Achird
    style: "İri yapılı, yumuşak kalpli, sakin ve biraz yavaş konuşan sevimli bir genç mucit gibi."
    edge: {voice: tr-TR-AhmetNeural, rate: "-6%", pitch: "-6Hz"}
    piper: {voice: fettah-medium, speed: 0.92, pitch: 0.98}
  pire:
    gemini: Leda
    style: "Küçük, meraklı ve heyecanlı bir çocuk gibi; hızlı, neşeli ve soru sorar gibi konuş."
    edge: {voice: tr-TR-EmelNeural, rate: "+14%", pitch: "+38Hz"}
    piper: {voice: dfki-medium, speed: 1.1, pitch: 1.4}

# İngilizce kardeş kanal (Mini World): her Türkçe bölüm İngilizceye uyarlanıp ayrı kanala yüklenir
# Yapay zekâ video yönetmeni (Gemini görsel): şimdilik sadece puan + rapor, yayını durdurmaz
yonetmen:
  acik: true

# A/B testi (23-30 Kasım): ortalama izlenme ~8,5 sn. Bu slotlar 20-25 sn kısa format, diğerleri normal.
deney:
  kisa_slotlar: []   # 45 sn Omni: normal senaryo

# 3D karakterler (Blender/Cycles, ücretsiz). Shorts'ta açık; uzun video 2D (render süresi). Blender yoksa otomatik 2D.
ucd:
  acik: false   # 23 Kasım: kanalda her şey Omni (3D kapalı)
  diller: [tr]
  ornek: 4

# Veo pilotu (günde 1 Shorts yapay zekâ videosu, ~0,9$/bölüm, GEMINI_IMAGE_KEY). Hata olursa 3D.
veo:
  acik: true
  yedek: bekle     # Omni hata verirse 3D'ye düşme, slotu sonra tekrar dene (kalite önce)
  motor: omni      # Gemini Omni 1.2 Flash (~0,07$/sn 720p). Hata/kredi bitti -> otomatik 3D
  slotlar: [aksam]
  perdeler: [15, 10, 10, 10]   # 45 sn: açılış + 3 kesintisiz uzatma (360p: ~1,04$ ≈ 52 TL)
  sure: 12         # Shorts uzunluğu (sn) ~0,84$
  uzun: false      # kredi eklenene kadar kapalı
  uzun_sure: 240   # hedef ~4 dk (16 x 15 sn çekim) ~17$
  uzun_segment: 15
  cozunurluk: "360p"          # ucuz çekim (0,023$/sn) + ücretsiz yapay zekâ büyütme
  buyut: true                 # Real-ESRGAN (CPU) ile 1080x1920
  modeller: [veo-3.1-lite-generate-preview, veo-3.1-fast-generate-preview]

# Boyalı arka plan (Nano Banana, ayrı ücretli anahtar GEMINI_IMAGE_KEY). Anahtar yoksa otomatik kapalı.
# A/B: sabah (kısa) + öğle (normal) boyalı; akşam (kısa) + gece (normal) çizim.
boya:
  acik: false   # Omni kendi sahnesini üretiyor
  slotlar: [sabah, oglen]
  boyut: "2K"

ingilizce:
  acik: false   # 23 Kasım: kalite için durduruldu (2D, 0 izlenme); Omni ile ileride yeniden
  # Kanal henüz dağıtım almıyor (0 izlenme); Gemini kotasını Türkçe kanala ayırmak için 1 hafta günde 2 + pazar uzun
  slotlar: [oglen, aksam, uzun]
  token_env: YT_REFRESH_TOKEN_EN
  tts_order: [gemini, edge]
  etiketler: ["mini world", "animation", "cartoon", "adventure", "tiny explorers", "animated series", "shorts"]
  voices:
    tuna:
      gemini: Puck
      style: "Brave, energetic, confident young explorer; eager, fast and smiling."
      edge: {voice: en-US-BrianNeural, rate: "+8%", pitch: "+10Hz"}
    nil:
      gemini: Kore
      style: "Smart, calm, precise young girl with dry humor; measured and clear."
      edge: {voice: en-US-AvaNeural, rate: "+0%", pitch: "+4Hz"}
    bulut:
      gemini: Achird
      style: "Big, soft-hearted, calm and slightly slow young inventor; warm and gentle."
      edge: {voice: en-US-GuyNeural, rate: "-6%", pitch: "-6Hz"}
    pire:
      gemini: Leda
      style: "Tiny, curious, excited kid; fast, cheerful, asks lots of questions."
      edge: {voice: en-US-AnaNeural, rate: "+10%", pitch: "+10Hz"}

# Yayın saatleri (Türkiye saati). Değiştirirsen .github/workflows/bot.yml içindeki cron satırlarını da güncelle.
takvim:
  sabah: "10:00 TR ana yolculuk (İngilizce: 07:00 ABD Doğu)"
  oglen: "12:30 TR yan macera (İngilizce: 10:00 ABD Doğu)"
  aksam: "16:00 TR ana yolculuk (İngilizce: 16:00 ABD Doğu)"
  gece: "18:30 TR yan macera (İngilizce: 18:00 ABD Doğu)"
  uzun: "Pazar 10:00 TR uzun video (İngilizce: Pazar 10:00 ABD Doğu)"
