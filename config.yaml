# MİNİ DÜNYA bot ayarları

kanal:
  ad: MİNİ DÜNYA
  dil: tr

yayin:
  # public = hemen yayınla, private = gizli yükle (önce izleyip elle açarsın), unlisted = liste dışı
  gizlilik: public
  yukle: false           # false yapılırsa video sadece üretilir, GitHub'dan indirilir
  kategori: 1            # Film ve Animasyon
  shorts_etiketleri: ["mini dünya", "animasyon", "macera", "keşif", "çizgi film", "shorts"]

senaryo:
  # Ücretsiz Gemini metin modelleri (sırayla denenir; hiçbiri olmazsa uygun model otomatik bulunur)
  modeller: ["gemini-2.5-flash", "gemini-flash-latest", "gemini-2.0-flash"]
  kalite_kontrol: true

tts:
  order: [gemini, edge, piper]
  gemini_models: ["gemini-2.5-flash-preview-tts", "gemini-3.1-flash-tts-preview"]

# Karakter sesleri. Ses kataloğu videosunu izledikten sonra beğendiğin sesleri buraya yazarız.
voices:
  tuna:
    gemini: Puck
    style: "Cesur, enerjik ve kendinden emin genç bir maceracı gibi; hevesli, hızlı ve gülümseyerek konuş."
    edge: {voice: tr-TR-AhmetNeural, rate: "+8%", pitch: "+14Hz"}
    piper: {voice: fahrettin-medium, speed: 1.05, pitch: 1.08}
  nil:
    gemini: Kore
    style: "Zeki, sakin ve net konuşan genç bir kız gibi; kuru espri yapar gibi, ölçülü ve tane tane konuş."
    edge: {voice: tr-TR-EmelNeural, rate: "+0%", pitch: "+6Hz"}
    piper: {voice: dfki-medium, speed: 1.0, pitch: 1.25}
  bulut:
    gemini: Achird
    style: "İri yapılı, yumuşak kalpli, sakin ve biraz yavaş konuşan sevimli bir genç mucit gibi."
    edge: {voice: tr-TR-AhmetNeural, rate: "-6%", pitch: "-6Hz"}
    piper: {voice: fettah-medium, speed: 0.92, pitch: 0.98}
  pire:
    gemini: Leda
    style: "Küçük, meraklı ve heyecanlı bir çocuk gibi; hızlı, neşeli ve soru sorar gibi konuş."
    edge: {voice: tr-TR-EmelNeural, rate: "+14%", pitch: "+38Hz"}
    piper: {voice: dfki-medium, speed: 1.1, pitch: 1.4}

# Yayın saatleri (Türkiye saati). Değiştirirsen .github/workflows/bot.yml içindeki cron satırlarını da güncelle.
takvim:
  sabah: "08:30 ana yolculuk"
  oglen: "13:30 yan macera"
  aksam: "19:30 ana yolculuk"
  gece: "21:30 yan macera"
  uzun: "Pazar 18:00 uzun video (4-5 dk)"
